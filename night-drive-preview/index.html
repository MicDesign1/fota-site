<!DOCTYPE html>
<html>
  <head>
    <title>Claudia Night Drive</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <meta name="robots" content="noindex,nofollow" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <link rel="stylesheet" type="text/css" title="main" href="./css/drivey.css?v=d94e67d" />
  </head>
  <body>
    <script src="./lib/theme.js?v=d94e67d"></script>
    <script type="module">
      import Drivey from "./js/Drivey.js?v=d94e67d";
      document.addEventListener(
        "touchmove",
        (e) => {
          if (e.target && typeof e.target.closest === "function" && e.target.closest("#dialoguePanel")) {
            return;
          }
          e.preventDefault();
        },
        { passive: false }
      );
      window.drivey = new Drivey();
    </script>
