    <script type="module">
      import Drivey from "./js/Drivey.js?v=hint2";
      document.addEventListener(
        "touchmove",
        (e) => {
          if (e.target && typeof e.target.closest === "function" && e.target.closest("#dialoguePanel")) {
            return;
          }
          e.preventDefault();
        },
        { passive: false }
      );
      window.drivey = new Drivey();
    </script>
